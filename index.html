<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Norvix — AI Strength & Nutrition Coach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121615;
    --surface:#1b211f;
    --surface2:#232a27;
    --line:#2c342f;
    --copper:#c9793c;
    --copper-soft:#e8a165;
    --sage:#7fa88b;
    --sage-soft:#a9c9b4;
    --text:#f2efe8;
    --muted:#95a19a;
    --danger:#c26456;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;position:relative;}
  body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.05;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");}
  h1,h2,h3,.display{font-family:'Space Grotesk',sans-serif;}
  button{font-family:'Inter',sans-serif;}
  #app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:78px;z-index:1;}

  /* ---- gate ---- */
  .gate{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:32px 28px;}
  .gate .mark{font-family:'Space Grotesk';font-weight:700;font-size:15px;letter-spacing:.28em;color:var(--copper-soft);margin-bottom:6px;}
  .gate h1{font-size:34px;line-height:1.1;margin:0 0 10px;font-weight:700;}
  .gate p.sub{color:var(--muted);font-size:15px;line-height:1.5;margin-bottom:28px;}
  .ring-hero{width:150px;height:150px;margin:6px 0 30px;}
  input[type=text],input[type=number]{width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--text);padding:14px 16px;border-radius:12px;font-size:16px;margin-bottom:12px;}
  input:focus{outline:none;border-color:var(--copper);}
  .btn{display:block;width:100%;text-align:center;border:none;border-radius:12px;padding:15px 18px;font-weight:600;font-size:15.5px;cursor:pointer;}
  .btn-primary{background:var(--copper);color:#1a1410;}
  .btn-ghost{background:transparent;color:var(--sage-soft);border:1px solid var(--line);}
  .btn-outline{background:transparent;color:var(--text);border:1px solid var(--line);}
  .link{color:var(--sage-soft);text-decoration:underline;font-size:13.5px;background:none;border:none;cursor:pointer;padding:0;}
  .err{color:var(--danger);font-size:13px;margin:-4px 0 12px;}

  /* ---- onboarding ---- */
  .ob{padding:26px 22px 30px;}
  .ob .step-label{color:var(--copper-soft);font-size:12px;letter-spacing:.18em;font-weight:600;margin-bottom:8px;}
  .ob h2{font-size:22px;margin:0 0 20px;}
  .opt-grid{display:flex;flex-direction:column;gap:10px;margin-bottom:8px;}
  .opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;font-size:15px;color:var(--text);cursor:pointer;text-align:left;transition:.15s;}
  .opt.sel{border-color:var(--copper);background:rgba(201,121,60,.12);color:var(--copper-soft);}
  .opt-grid.row{flex-direction:row;flex-wrap:wrap;}
  .opt-grid.row .opt{flex:1 1 auto;text-align:center;}
  textarea{width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--text);padding:14px 16px;border-radius:12px;font-size:15px;min-height:70px;font-family:inherit;}
  .ob-nav{display:flex;gap:10px;margin-top:26px;}
  .ob-nav .btn{flex:1;}
  .progress-dots{display:flex;gap:5px;margin-bottom:18px;}
  .progress-dots span{height:3px;flex:1;background:var(--line);border-radius:2px;}
  .progress-dots span.on{background:var(--copper);}

  /* ---- shell ---- */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:20px 22px 8px;}
  .topbar .mark{font-family:'Space Grotesk';font-weight:700;letter-spacing:.2em;font-size:13px;color:var(--copper-soft);}
  .topbar .day{color:var(--muted);font-size:13px;}
  .screen{padding:8px 22px 20px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;}
  .card h3{margin:0 0 4px;font-size:13px;letter-spacing:.12em;color:var(--muted);font-weight:600;text-transform:uppercase;}
  .card .big{font-size:19px;font-weight:600;margin:6px 0 2px;}
  .card .meta{color:var(--muted);font-size:13.5px;}
  .row-between{display:flex;align-items:center;justify-content:space-between;}

  .rings{display:flex;justify-content:space-around;margin:10px 0 4px;}
  .ring-item{display:flex;flex-direction:column;align-items:center;gap:6px;}
  .ring-item span{font-size:11px;color:var(--muted);letter-spacing:.06em;}
  .ring-item b{font-size:13px;color:var(--text);}

  .meal-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-top:1px solid var(--line);}
  .meal-row:first-of-type{border-top:none;}
  .meal-name{font-size:14.5px;}
  .meal-title{font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;}
  .check{width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .check.on{background:var(--sage);border-color:var(--sage);color:#0f1512;font-weight:700;font-size:13px;}
  .swap-btn{background:none;border:none;color:var(--copper-soft);font-size:12.5px;cursor:pointer;padding:4px 0;}

  .navbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border-top:1px solid var(--line);display:flex;padding:10px 6px 14px;z-index:20;}
  .navbar button{flex:1;background:none;border:none;color:var(--muted);font-size:10.5px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;letter-spacing:.03em;}
  .navbar button.active{color:var(--copper-soft);}
  .navbar .ic{width:20px;height:20px;display:block;}
  .navbar .ic svg{width:100%;height:100%;stroke:currentColor;fill:none;stroke-width:1.6;}

  .timing-badge{display:inline-block;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--copper-soft);background:rgba(201,121,60,.14);border-radius:5px;padding:2px 6px;margin-top:3px;font-weight:600;}
  .streak-badge{display:flex;align-items:center;gap:5px;background:var(--surface2);border-radius:20px;padding:5px 11px;font-size:12.5px;color:var(--copper-soft);font-weight:600;}
  .streak-badge svg{width:13px;height:13px;fill:var(--copper-soft);}

  .sub-tab{display:flex;gap:8px;margin-bottom:14px;}
  .sub-tab button{flex:1;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:10px;border-radius:10px;font-size:13px;cursor:pointer;font-weight:600;}
  .sub-tab button.on{background:var(--copper);border-color:var(--copper);color:#1a1410;}
  .prep-block{border-top:1px solid var(--line);padding:12px 0;}
  .prep-block:first-of-type{border-top:none;}
  .prep-block .p-title{font-size:14.5px;font-weight:600;margin-bottom:3px;}
  .prep-block .p-detail{color:var(--muted);font-size:13px;line-height:1.5;}

  .day-tab{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;}
  .day-tab button{flex-shrink:0;border:1px solid var(--line);background:var(--surface);color:var(--muted);padding:8px 13px;border-radius:20px;font-size:12.5px;cursor:pointer;}
  .day-tab button.on{background:var(--copper);border-color:var(--copper);color:#1a1410;font-weight:600;}

  .cat-title{font-size:12px;letter-spacing:.12em;color:var(--copper-soft);text-transform:uppercase;margin:16px 0 8px;font-weight:600;}
  .shop-row{display:flex;align-items:center;gap:12px;padding:9px 0;border-top:1px solid var(--line);}
  .shop-row:first-of-type{border-top:none;}
  .shop-row.done .shop-name{color:var(--muted);text-decoration:line-through;}
  .shop-name{font-size:14.5px;}

  .chip-row{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0;}
  .chip{background:var(--surface2);border:1px solid var(--line);border-radius:20px;padding:7px 13px;font-size:13px;display:flex;align-items:center;gap:6px;}
  .chip button{background:none;border:none;color:var(--muted);cursor:pointer;font-size:14px;}
  .ing-input{display:flex;gap:8px;}
  .ing-input input{flex:1;margin:0;}
  .cam-btn{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px;color:var(--sage-soft);font-size:14px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;width:100%;margin-top:10px;}

  .loading{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 20px;color:var(--muted);gap:14px;text-align:center;}
  .spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--copper);border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .review-line{font-size:14.5px;line-height:1.6;color:var(--text);margin-top:8px;}
  .stat-grid{display:flex;gap:10px;margin:14px 0;}
  .stat{flex:1;background:var(--surface2);border-radius:12px;padding:14px 10px;text-align:center;}
  .stat b{font-family:'Space Grotesk';font-size:22px;display:block;color:var(--copper-soft);}
  .stat span{font-size:10.5px;color:var(--muted);letter-spacing:.06em;}

  .modal-bg{position:fixed;inset:0;background:rgba(10,12,11,.7);display:flex;align-items:flex-end;z-index:50;}
  .modal{background:var(--surface);width:100%;max-width:480px;margin:0 auto;border-radius:20px 20px 0 0;padding:22px;max-height:80vh;overflow-y:auto;}
  .modal h3{margin:0 0 14px;font-size:17px;}
</style>
</head>
<body>
<div id="app"></div>

<script>
if(!window.storage){
  window.storage = {
    async get(key){
      const v = localStorage.getItem('norvix_'+key);
      if(v===null){ throw new Error('not found'); }
      return {key, value:v, shared:false};
    },
    async set(key, value){
      localStorage.setItem('norvix_'+key, value);
      return {key, value, shared:false};
    },
    async delete(key){
      localStorage.removeItem('norvix_'+key);
      return {key, deleted:true, shared:false};
    },
    async list(prefix){
      const keys = Object.keys(localStorage).filter(k=>k.startsWith('norvix_'+(prefix||''))).map(k=>k.replace('norvix_',''));
      return {keys};
    }
  };
}
const GUMROAD_PRODUCT_PERMALINK = "aicoach";

let state = {
  screen: 'loading-boot',
  tab: 'today',
  profile: null,
  weekplan: null,
  checklist: null,
  shopping: null,
  obStep: 0,
  obData: {},
  activeDay: 0,
  busy: false,
  busyMsg: '',
  ingredients: [],
  recipeResults: null,
  swapTarget: null,
  review: null
};

function render(){ document.getElementById('app').innerHTML = view(); bind(); }

async function boot(){
  try{
    const lic = await window.storage.get('norvix-license').catch(()=>null);
    if(!lic || !lic.value){ state.screen = 'gate'; render(); return; }
    const profile = await window.storage.get('norvix-profile').catch(()=>null);
    if(!profile || !profile.value){ state.screen = 'onboarding'; render(); return; }
    state.profile = JSON.parse(profile.value);
    const wp = await window.storage.get('norvix-weekplan').catch(()=>null);
    const cl = await window.storage.get('norvix-checklist').catch(()=>null);
    const sh = await window.storage.get('norvix-shopping').catch(()=>null);
    if(wp && wp.value) state.weekplan = JSON.parse(wp.value);
    if(cl && cl.value) state.checklist = JSON.parse(cl.value);
    if(sh && sh.value) state.shopping = JSON.parse(sh.value);
    const pp = await window.storage.get('norvix-prep').catch(()=>null);
    const pc = await window.storage.get('norvix-prep-checked').catch(()=>null);
    if(pp && pp.value) state.prepPlan = JSON.parse(pp.value);
    if(pc && pc.value) state.prepChecked = JSON.parse(pc.value);
    state.screen = state.weekplan ? 'home' : 'generate-first';
  }catch(e){ state.screen = 'gate'; }
  render();
}

/* ---------- Claude API helper ---------- */
async function callClaude(system, userContent){
  const res = await fetch("/api/chat", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({ system, userContent })
  });
  const data = await res.json();
  if(data.error){ throw new Error(data.error.message || data.error); }
  const textBlocks = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n');
  return textBlocks;
}
function parseJSON(txt){
  const cleaned = txt.replace(/```json/g,'').replace(/```/g,'').trim();
  const start = cleaned.indexOf(cleaned.trim()[0]);
  try{ return JSON.parse(cleaned); }
  catch(e){
    const m = cleaned.match(/\{[\s\S]*\}|\[[\s\S]*\]/);
    if(m) return JSON.parse(m[0]);
    throw e;
  }
}

/* ---------- License gate ---------- */
async function verifyLicense(key){
  if(!key || key.trim().length < 4) return {ok:false, msg:"Enter your license key from your Norvix purchase email."};
  const normalized = key.trim().toUpperCase().replace(/[\u2010-\u2015\u2212]/g,'-').replace(/\s+/g,'');
  if(normalized === "NORVIX-DEV-2026"){ return {ok:true}; } // dev/tester bypass — remove before public launch
  try{
    const controller = new AbortController();
    const timeout = setTimeout(()=>controller.abort(), 8000);
    const res = await fetch("https://api.gumroad.com/v2/licenses/verify", {
      method:"POST",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body:`product_permalink=${encodeURIComponent(GUMROAD_PRODUCT_PERMALINK)}&license_key=${encodeURIComponent(key.trim())}`,
      signal: controller.signal
    });
    clearTimeout(timeout);
    const data = await res.json();
    if(data && data.success){ return {ok:true}; }
    return {ok:false, msg:"That license key didn't verify. Check it and try again."};
  }catch(e){
    return {ok:false, msg:"Couldn't reach the license server. Check your connection and try again."};
  }
}

/* ---------- Onboarding steps ---------- */
const OB_STEPS = [
  {key:'goal', title:'Primary goal', type:'single', options:['Build muscle & strength','Lose fat, keep muscle','Maintain & feel strong','Improve energy','General healthy living']},
  {key:'experience', title:'Training experience', type:'single', options:['New to training','Some experience','Very experienced']},
  {key:'equipment', title:'Equipment access', type:'single', options:['Full gym','Dumbbells / home gym','Bodyweight only']},
  {key:'diet', title:'Diet preference', type:'single', options:['No preference','Vegetarian','Vegan','Mediterranean','High-protein']},
  {key:'mealsPerDay', title:'Meals per day', type:'single', options:['2','3','4','5'], row:true},
  {key:'cookingTime', title:'Cooking time you have', type:'single', options:['Almost none','15 min','30 min','I enjoy cooking']},
  {key:'restrict', title:"Allergies, intolerances or foods you avoid", type:'text', placeholder:'e.g. peanuts, shellfish, dairy — or leave blank'},
  {key:'location', title:'Country / region', type:'text', placeholder:'Helps tailor meals to what\'s available near you'}
];

/* ---------- Views ---------- */
function view(){
  if(state.screen==='loading-boot') return `<div class="loading"><div class="spinner"></div></div>`;
  if(state.screen==='gate') return gateView();
  if(state.screen==='onboarding') return onboardingView();
  if(state.busy) return busyView();
  if(state.screen==='generate-first') return generateFirstView();
  return shellView();
}

function ring(pct,color,size){
  size = size||60;
  const r = size/2 - 5, c = 2*Math.PI*r, off = c - (pct/100)*c;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="#2c342f" stroke-width="5"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="5" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}" transform="rotate(-90 ${size/2} ${size/2})"/>
  </svg>`;
}

function gateView(){
  return `<div class="gate">
    <div class="mark">NORVIX</div>
    <h1>Train smarter.<br>Eat with purpose.</h1>
    <p class="sub">Your AI coach for strength training and the meals that support it — built for adults building strength that lasts.</p>
    <div class="ring-hero">${ring(72,'#c9793c',150)}</div>
    <div id="gate-err" class="err" style="display:none"></div>
    <input type="text" id="lic-input" placeholder="Enter your license key">
    <button class="btn btn-primary" id="verify-btn">Unlock Norvix</button>
    <div style="height:14px"></div>
    <a class="link" href="https://norvix.gumroad.com" target="_blank" style="text-align:center;display:block">Don't have a key? Get Norvix →</a>
  </div>`;
}

function onboardingView(){
  const step = OB_STEPS[state.obStep];
  const dots = OB_STEPS.map((s,i)=>`<span class="${i<=state.obStep?'on':''}"></span>`).join('');
  const val = state.obData[step.key];
  let body = '';
  if(step.type==='single'){
    body = `<div class="opt-grid ${step.row?'row':''}">${step.options.map(o=>
      `<button class="opt ${val===o?'sel':''}" data-choose="${o}">${o}</button>`).join('')}</div>`;
  } else {
    body = `<textarea id="ob-text" placeholder="${step.placeholder||''}">${val||''}</textarea>`;
  }
  const canNext = step.type==='text' ? true : !!val;
  return `<div class="ob">
    <div class="progress-dots">${dots}</div>
    <div class="step-label">STEP ${state.obStep+1} OF ${OB_STEPS.length}</div>
    <h2>${step.title}</h2>
    ${body}
    <div class="ob-nav">
      ${state.obStep>0?`<button class="btn btn-outline" id="ob-back">Back</button>`:''}
      <button class="btn btn-primary" id="ob-next" ${canNext?'':'disabled style="opacity:.4"'}>${state.obStep===OB_STEPS.length-1?'Build my plan':'Next'}</button>
    </div>
  </div>`;
}

function busyView(){
  return `<div class="loading"><div class="spinner"></div><div>${state.busyMsg||'Norvix is thinking...'}</div></div>`;
}

function generateFirstView(){
  return `<div class="ob">
    <div class="mark" style="color:var(--copper-soft);font-weight:700;letter-spacing:.2em;font-size:13px;margin-bottom:10px">NORVIX</div>
    <h2 style="font-size:24px">Your profile is set.</h2>
    <p style="color:var(--muted);line-height:1.6;font-size:15px">Norvix will now build your first 7-day training and meal plan — matched to your goal, your kitchen, and your training days.</p>
    <button class="btn btn-primary" id="build-week" style="margin-top:16px">Build my week</button>
  </div>`;
}

function shellView(){
  let content = '';
  if(state.tab==='today') content = todayView();
  else if(state.tab==='week') content = weekView();
  else if(state.tab==='shop') content = shopView();
  else if(state.tab==='make') content = makeView();
  else if(state.tab==='coach') content = coachView();

  return `<div class="topbar"><div class="mark">NORVIX</div><div class="day">${dayLabel(state.activeDay)}</div></div>
  <div class="screen">${content}</div>
  <div class="navbar">
    ${navBtn('today',ICONS.today,'Today')}
    ${navBtn('week',ICONS.week,'Week')}
    ${navBtn('shop',ICONS.shop,'Shop')}
    ${navBtn('make',ICONS.make,'Make')}
    ${navBtn('coach',ICONS.coach,'Coach')}
  </div>
  ${state.swapTarget!==null?swapModal():''}
  ${state.recipeResults?recipeModal():''}`;
}
const ICONS = {
  today:`<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/><circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/></svg>`,
  week:`<svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="16" rx="2.5"/><path d="M3.5 9.5h17"/><path d="M8 3v3M16 3v3"/></svg>`,
  shop:`<svg viewBox="0 0 24 24"><path d="M5 8h14l-1.4 11.2a2 2 0 01-2 1.8H8.4a2 2 0 01-2-1.8L5 8z"/><path d="M8.5 8V6.5a3.5 3.5 0 017 0V8"/></svg>`,
  make:`<svg viewBox="0 0 24 24"><path d="M12 3l1.6 4.6L18 9l-4.4 1.4L12 15l-1.6-4.6L6 9l4.4-1.4L12 3z"/><path d="M18.5 15l.8 2.2 2.2.8-2.2.8-.8 2.2-.8-2.2-2.2-.8 2.2-.8.8-2.2z"/></svg>`,
  coach:`<svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 10-3.2 6.4"/><path d="M20 5v5h-5"/></svg>`
};
function navBtn(id,ic,label){
  return `<button class="${state.tab===id?'active':''}" data-tab="${id}"><span class="ic">${ic}</span>${label}</button>`;
}
function dayLabel(i){
  const names=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
  return names[i]||'';
}

function todayView(){
  if(!state.weekplan) return `<div class="card">No plan yet.</div>`;
  const d = state.weekplan.days[state.activeDay];
  const cl = state.checklist || {workouts:[false,false,false,false,false,false,false], meals:{}};
  const dayMeals = cl.meals[state.activeDay] || {};
  const mealTypes = Object.keys(d.meals||{});
  const mealsDone = mealTypes.filter(m=>dayMeals[m]).length;
  const workoutPct = cl.workouts[state.activeDay] ? 100 : 0;
  const mealPct = mealTypes.length ? Math.round(mealsDone/mealTypes.length*100) : 0;

  const streak = computeStreak(cl);
  return `
  <div class="card">
    <div class="row-between" style="margin-bottom:2px">
      <span style="font-size:11px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase">Momentum</span>
      ${streak>0?`<div class="streak-badge"><svg viewBox="0 0 24 24"><path d="M12 2c1 4-3 5-3 9a5 5 0 0010 0c0-2-1-3-1-3s0 3-2 3c1-4-2-5-2-9-1 1-2 2-2 0z"/></svg>${streak} day${streak===1?'':'s'} strong</div>`:''}
    </div>
    <div class="rings">
      <div class="ring-item">${ring(workoutPct,'#c9793c',58)}<span>TRAINING</span></div>
      <div class="ring-item">${ring(mealPct,'#7fa88b',58)}<span>NUTRITION</span></div>
      <div class="ring-item">${ring(cl.workouts[state.activeDay]&&mealPct===100?100:Math.round((workoutPct+mealPct)/2),'#e8a165',58)}<span>OVERALL</span></div>
    </div>
  </div>
  <div class="card">
    <h3>Today's Training</h3>
    <div class="row-between">
      <div>
        <div class="big">${d.workout.name}</div>
        <div class="meta">${d.workout.duration} · ${d.workout.type||''}</div>
      </div>
      <div class="check ${cl.workouts[state.activeDay]?'on':''}" data-workout-toggle="${state.activeDay}">${cl.workouts[state.activeDay]?'✓':''}</div>
    </div>
    ${d.workout.exercises?`<div style="margin-top:12px;color:var(--muted);font-size:13.5px;line-height:1.7">${d.workout.exercises.join(' · ')}</div>`:''}
  </div>
  <div class="card">
    <h3>Today's Nutrition</h3>
    ${mealTypes.map(mt=>`
      <div class="meal-row">
        <div>
          <div class="meal-title">${mt}</div>
          <div class="meal-name">${d.meals[mt].name||d.meals[mt]}</div>
          ${d.meals[mt].timing && d.meals[mt].timing.toLowerCase()!=='standard' ? `<div class="timing-badge">${d.meals[mt].timing}</div>` : ''}
          <div><button class="swap-btn" data-swap-day="${state.activeDay}" data-swap-meal="${mt}">Swap meal</button></div>
        </div>
        <div class="check ${dayMeals[mt]?'on':''}" data-meal-toggle="${state.activeDay}|${mt}">${dayMeals[mt]?'✓':''}</div>
      </div>`).join('')}
  </div>`;
}
function computeStreak(cl){
  let streak = 0;
  for(let i=0;i<7;i++){
    const dm = cl.meals[i]||{};
    const mealTypes = state.weekplan.days[i] ? Object.keys(state.weekplan.days[i].meals||{}) : [];
    const allMeals = mealTypes.length>0 && mealTypes.every(m=>dm[m]);
    if(cl.workouts[i] && allMeals) streak++;
    else break;
  }
  return streak;
}

function weekView(){
  if(!state.weekplan) return `<div class="card">No plan yet.</div>`;
  const tabs = state.weekplan.days.map((d,i)=>`<button class="${state.activeDay===i?'on':''}" data-day="${i}">${dayLabel(i).slice(0,3)}</button>`).join('');
  return `<div class="day-tab">${tabs}</div>${todayView()}
  <button class="btn btn-outline" id="rebuild-week" style="margin-top:6px">Rebuild next week's plan</button>`;
}

function shopView(){
  const sub = state.shopSubTab || 'list';
  const tabs = `<div class="sub-tab">
    <button class="${sub==='list'?'on':''}" data-shopsub="list">Shopping List</button>
    <button class="${sub==='prep'?'on':''}" data-shopsub="prep">Prep My Week</button>
  </div>`;
  if(sub==='prep') return tabs + prepView();
  if(!state.shopping) return tabs + `<div class="card"><p style="color:var(--muted);font-size:14.5px;margin-top:0">No shopping list yet — Norvix builds it from your week's meals.</p><button class="btn btn-primary" id="gen-shop">Generate shopping list</button></div>`;
  const cats = Object.keys(state.shopping.items);
  return tabs + `<div class="card">
    <div class="row-between"><h3 style="margin-bottom:0">Your Shopping List</h3><button class="link" id="gen-shop">Rebuild</button></div>
    ${cats.map(cat=>`
      <div class="cat-title">${cat}</div>
      ${state.shopping.items[cat].map((item,i)=>{
        const key = cat+'|'+i;
        const done = (state.shopping.checked||{})[key];
        return `<div class="shop-row ${done?'done':''}">
          <div class="check ${done?'on':''}" data-shop-check="${key}">${done?'✓':''}</div>
          <div class="shop-name">${item}</div>
        </div>`;
      }).join('')}
    `).join('')}
  </div>`;
}

function prepView(){
  if(!state.weekplan) return `<div class="card">Build a week plan first.</div>`;
  if(!state.prepPlan) return `<div class="card"><p style="color:var(--muted);font-size:14.5px;margin-top:0">Batch-prep your components in one sitting — Norvix breaks your week's meals into a single prep session.</p><button class="btn btn-primary" id="gen-prep">Build my prep plan</button></div>`;
  return `<div class="card">
    <div class="row-between"><h3 style="margin-bottom:0">Sunday Prep Session</h3><button class="link" id="gen-prep">Rebuild</button></div>
    <div class="meta" style="margin:4px 0 10px">${state.prepPlan.total_time||''}</div>
    ${(state.prepPlan.tasks||[]).map((t,i)=>{
      const done = (state.prepChecked||{})[i];
      return `<div class="prep-block">
        <div class="row-between">
          <div><div class="p-title">${t.title}</div><div class="p-detail">${t.detail}</div></div>
          <div class="check ${done?'on':''}" data-prep-check="${i}">${done?'✓':''}</div>
        </div>
      </div>`;
    }).join('')}
  </div>`;
}

function makeView(){
  return `<div class="card">
    <h3>What Can I Make?</h3>
    <p style="color:var(--muted);font-size:14px;margin-top:4px">List what's in your kitchen, or snap a photo, and Norvix suggests meals.</p>
    <div class="chip-row">${state.ingredients.map((ing,i)=>`<div class="chip">${ing}<button data-remove-ing="${i}">×</button></div>`).join('')}</div>
    <div class="ing-input">
      <input type="text" id="ing-add" placeholder="e.g. chicken, spinach, rice">
      <button class="btn btn-primary" style="width:auto;padding:14px 18px" id="ing-add-btn">Add</button>
    </div>
    <button class="cam-btn" id="cam-trigger">📷 Scan my fridge or kitchen</button>
    <input type="file" id="cam-input" accept="image/*" capture="environment" style="display:none">
    <button class="btn btn-primary" id="what-make" style="margin-top:16px" ${state.ingredients.length?'':'disabled style="opacity:.4"'}>What can I make?</button>
  </div>`;
}

function coachView(){
  const cl = state.checklist || {workouts:[false,false,false,false,false,false,false], meals:{}};
  const workoutsDone = cl.workouts.filter(Boolean).length;
  let totalMeals=0, doneMeals=0;
  if(state.weekplan){
    state.weekplan.days.forEach((d,i)=>{
      const mt = Object.keys(d.meals||{});
      totalMeals += mt.length;
      const dm = cl.meals[i]||{};
      doneMeals += mt.filter(m=>dm[m]).length;
    });
  }
  const adherence = totalMeals ? Math.round(doneMeals/totalMeals*100) : 0;
  return `<div class="card">
    <h3>Weekly Review</h3>
    <div class="stat-grid">
      <div class="stat"><b>${workoutsDone}/7</b><span>WORKOUTS</span></div>
      <div class="stat"><b>${adherence}%</b><span>MEAL PLAN</span></div>
    </div>
    ${state.review ? `<div class="review-line">${state.review}</div>` : `<p style="color:var(--muted);font-size:14px">Get an AI coaching note based on this week's consistency.</p>`}
    <button class="btn btn-primary" id="get-review" style="margin-top:14px">${state.review?'Refresh review':'Get coach review'}</button>
    <button class="btn btn-outline" id="next-week" style="margin-top:10px">Generate next week</button>
  </div>`;
}

function swapModal(){
  const {day,meal} = state.swapTarget;
  const reasons = ["Don't like it","Don't have ingredients","Too expensive","Takes too long","Want something different"];
  return `<div class="modal-bg" id="swap-bg"><div class="modal">
    <h3>Swap this meal</h3>
    <div class="opt-grid">${reasons.map(r=>`<button class="opt" data-swap-reason="${r}">${r}</button>`).join('')}</div>
    <button class="btn btn-ghost" id="swap-cancel" style="margin-top:10px">Cancel</button>
  </div></div>`;
}

function recipeModal(){
  return `<div class="modal-bg" id="recipe-bg"><div class="modal">
    <h3>You could make...</h3>
    ${state.recipeResults.map((r,i)=>`
      <div class="card" style="margin-bottom:10px">
        <div class="big" style="font-size:16px">${r.name}</div>
        <div class="meta" style="margin:6px 0">${r.description}</div>
        <div style="color:var(--muted);font-size:13px">${(r.ingredients_used||[]).join(', ')}</div>
      </div>`).join('')}
    <button class="btn btn-ghost" id="recipe-close">Close</button>
  </div></div>`;
}

/* ---------- Actions ---------- */
function bind(){
  const $ = s=>document.querySelector(s);
  const $$ = s=>document.querySelectorAll(s);

  if($('#verify-btn')) $('#verify-btn').onclick = async ()=>{
    const key = $('#lic-input').value;
    $('#verify-btn').textContent = 'Checking...';
    const r = await verifyLicense(key);
    if(r.ok){
      await window.storage.set('norvix-license', key.trim());
      state.screen='onboarding'; render();
    } else {
      $('#gate-err').style.display='block'; $('#gate-err').textContent = r.msg;
      $('#verify-btn').textContent = 'Unlock Norvix';
    }
  };

  $$('[data-choose]').forEach(b=>b.onclick=()=>{
    const step = OB_STEPS[state.obStep];
    state.obData[step.key] = b.dataset.choose;
    render();
  });
  if($('#ob-text')) $('#ob-text').oninput = e=>{ state.obData[OB_STEPS[state.obStep].key] = e.target.value; };
  if($('#ob-back')) $('#ob-back').onclick = ()=>{ state.obStep--; render(); };
  if($('#ob-next')) $('#ob-next').onclick = async ()=>{
    if(OB_STEPS[state.obStep].type==='text'){
      state.obData[OB_STEPS[state.obStep].key] = $('#ob-text') ? $('#ob-text').value : (state.obData[OB_STEPS[state.obStep].key]||'');
    }
    if(state.obStep < OB_STEPS.length-1){ state.obStep++; render(); }
    else{
      state.profile = state.obData;
      await window.storage.set('norvix-profile', JSON.stringify(state.profile));
      state.screen = 'generate-first'; render();
    }
  };

  if($('#build-week')) $('#build-week').onclick = generateWeek;
  if($('#rebuild-week') || $('#next-week')){
    const el = $('#rebuild-week') || $('#next-week');
    el.onclick = generateWeek;
  }

  $$('[data-tab]').forEach(b=>b.onclick=()=>{ state.tab=b.dataset.tab; render(); });
  $$('[data-day]').forEach(b=>b.onclick=()=>{ state.activeDay = parseInt(b.dataset.day); render(); });

  $$('[data-workout-toggle]').forEach(b=>b.onclick=async ()=>{
    const i = parseInt(b.dataset.workoutToggle);
    ensureChecklist();
    state.checklist.workouts[i] = !state.checklist.workouts[i];
    await saveChecklist(); render();
  });
  $$('[data-meal-toggle]').forEach(b=>b.onclick=async ()=>{
    const [day,mt] = b.dataset.mealToggle.split('|');
    ensureChecklist();
    if(!state.checklist.meals[day]) state.checklist.meals[day]={};
    state.checklist.meals[day][mt] = !state.checklist.meals[day][mt];
    await saveChecklist(); render();
  });

  $$('[data-swap-day]').forEach(b=>b.onclick=()=>{
    state.swapTarget = {day: parseInt(b.dataset.swapDay), meal: b.dataset.swapMeal};
    render();
  });
  if($('#swap-cancel')) $('#swap-cancel').onclick = ()=>{ state.swapTarget=null; render(); };
  $$('[data-swap-reason]').forEach(b=>b.onclick=()=>doSwap(b.dataset.swapReason));

  if($('#gen-shop')) $('#gen-shop').onclick = generateShoppingList;
  $$('[data-shopsub]').forEach(b=>b.onclick=()=>{ state.shopSubTab = b.dataset.shopsub; render(); });
  if($('#gen-prep')) $('#gen-prep').onclick = generatePrepPlan;
  $$('[data-prep-check]').forEach(b=>b.onclick=async ()=>{
    if(!state.prepChecked) state.prepChecked={};
    const k = b.dataset.prepCheck;
    state.prepChecked[k] = !state.prepChecked[k];
    await window.storage.set('norvix-prep-checked', JSON.stringify(state.prepChecked));
    render();
  });
  $$('[data-shop-check]').forEach(b=>b.onclick=async ()=>{
    if(!state.shopping.checked) state.shopping.checked={};
    const k = b.dataset.shopCheck;
    state.shopping.checked[k] = !state.shopping.checked[k];
    await window.storage.set('norvix-shopping', JSON.stringify(state.shopping));
    render();
  });

  if($('#ing-add-btn')) $('#ing-add-btn').onclick = ()=>{
    const v = $('#ing-add').value.trim();
    if(v){ state.ingredients.push(v); render(); }
  };
  if($('#ing-add')) $('#ing-add').onkeydown = e=>{ if(e.key==='Enter'){ e.preventDefault(); $('#ing-add-btn').click(); } };
  $$('[data-remove-ing]').forEach(b=>b.onclick=()=>{ state.ingredients.splice(parseInt(b.dataset.removeIng),1); render(); });
  if($('#cam-trigger')) $('#cam-trigger').onclick = ()=>$('#cam-input').click();
  if($('#cam-input')) $('#cam-input').onchange = handlePhoto;
  if($('#what-make')) $('#what-make').onclick = ()=>whatCanIMake(null);
  if($('#recipe-close')) $('#recipe-close').onclick = ()=>{ state.recipeResults=null; render(); };

  if($('#get-review')) $('#get-review').onclick = generateReview;
}

function ensureChecklist(){
  if(!state.checklist) state.checklist = {workouts:[false,false,false,false,false,false,false], meals:{}};
}
async function saveChecklist(){ await window.storage.set('norvix-checklist', JSON.stringify(state.checklist)); }

async function generateWeek(){
  state.busy = true; state.busyMsg = 'Building your 7-day training and meal plan...'; render();
  const system = `You are Norvix, an AI strength and nutrition coach for adults over 35 focused on sustainable strength and longevity. Return ONLY valid JSON, no markdown, no preamble. Do not give medical advice — position everything as general fitness and nutrition support.`;
  const p = state.profile;
  const prompt = `Build a 7-day plan (Monday–Sunday) for this person:
Goal: ${p.goal}
Experience: ${p.experience}
Equipment: ${p.equipment}
Diet preference: ${p.diet}
Meals per day: ${p.mealsPerDay}
Cooking time available: ${p.cookingTime}
Avoid/allergies: ${p.restrict||'none specified'}
Region: ${p.location||'not specified'}

Include 3-4 strength/training days appropriate to experience and equipment, and active recovery/rest days. Meals should match "mealsPerDay" (use keys like breakfast, lunch, dinner, snack as applicable) and be realistic for the stated cooking time, diet, and region. On training days, tag meals by their role relative to training (e.g. "pre-workout", "post-workout", "standard"); on recovery days use "recovery" or "standard" as fitting. Return strictly this JSON shape:
{"days":[{"day":"Monday","workout":{"name":"...","duration":"25 min","type":"Full Body Strength","exercises":["Squat 3x10","..."]},"meals":{"breakfast":{"name":"...","timing":"standard"},"lunch":{"name":"...","timing":"standard"},"dinner":{"name":"...","timing":"post-workout"}}}, ... 7 total]}`;
  try{
    const txt = await callClaude(system, prompt);
    const plan = parseJSON(txt);
    state.weekplan = plan;
    await window.storage.set('norvix-weekplan', JSON.stringify(plan));
    state.checklist = {workouts:[false,false,false,false,false,false,false], meals:{}};
    await saveChecklist();
    state.shopping = null;
    state.prepPlan = null;
    state.prepChecked = {};
    state.activeDay = 0;
    state.screen = 'home'; state.tab='today';
  }catch(e){
    alert('Norvix had trouble building your plan: ' + e.message);
    state.screen = state.weekplan ? 'home' : 'generate-first';
  }
  state.busy = false; render();
}

async function doSwap(reason){
  const {day, meal} = state.swapTarget;
  state.swapTarget = null; state.busy = true; state.busyMsg = 'Finding a better fit...'; render();
  const system = `You are Norvix, an AI nutrition coach. Return ONLY valid JSON, no markdown.`;
  const d = state.weekplan.days[day];
  const p = state.profile;
  const prompt = `Replace the "${meal}" meal currently "${d.meals[meal].name}" because: ${reason}.
Diet preference: ${p.diet}. Avoid: ${p.restrict||'none'}. Cooking time: ${p.cookingTime}. Region: ${p.location||'n/a'}. Keep its original timing role: ${d.meals[meal].timing||'standard'}.
Return strictly: {"name":"New meal name","timing":"${d.meals[meal].timing||'standard'}"}`;
  try{
    const txt = await callClaude(system, prompt);
    const result = parseJSON(txt);
    state.weekplan.days[day].meals[meal] = result;
    await window.storage.set('norvix-weekplan', JSON.stringify(state.weekplan));
  }catch(e){ alert('Could not generate a swap right now.'); }
  state.busy = false; render();
}

async function generateShoppingList(){
  state.busy = true; state.busyMsg = 'Building your shopping list...'; render();
  const system = `You are Norvix, an AI nutrition coach. Return ONLY valid JSON, no markdown.`;
  const mealsList = state.weekplan.days.map(d=>Object.values(d.meals).map(m=>m.name||m).join(', ')).join(' | ');
  const prompt = `Given this week's meals: ${mealsList}
Produce a consolidated shopping list grouped into categories (use these category names exactly where applicable: Protein, Carbohydrates, Vegetables, Fruit, Pantry). Return strictly:
{"items":{"Protein":["..."],"Carbohydrates":["..."],"Vegetables":["..."],"Fruit":["..."],"Pantry":["..."]}}`;
  try{
    const txt = await callClaude(system, prompt);
    const result = parseJSON(txt);
    state.shopping = {items: result.items, checked:{}};
    await window.storage.set('norvix-shopping', JSON.stringify(state.shopping));
  }catch(e){ alert('Could not build the shopping list right now.'); }
  state.busy = false; render();
}

async function generatePrepPlan(){
  state.busy = true; state.busyMsg = 'Building your prep session...'; render();
  const system = `You are Norvix, an AI nutrition coach. Return ONLY valid JSON, no markdown.`;
  const mealsList = state.weekplan.days.map(d=>Object.values(d.meals).map(m=>m.name||m).join(', ')).join(' | ');
  const prompt = `Given this week's meals: ${mealsList}
Group them into a single efficient batch-prep session (proteins to cook together, carbs to cook together, vegetables to wash/chop together, breakfasts to prep ahead, etc). Return strictly:
{"total_time":"Approx. 60-90 minutes","tasks":[{"title":"Cook proteins","detail":"..."}, ...]}`;
  try{
    const txt = await callClaude(system, prompt);
    const result = parseJSON(txt);
    state.prepPlan = result;
    state.prepChecked = {};
    await window.storage.set('norvix-prep', JSON.stringify(result));
  }catch(e){ alert('Could not build the prep plan right now.'); }
  state.busy = false; render();
}

function handlePhoto(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ()=>{ whatCanIMake(reader.result.split(',')[1], file.type); };
  reader.readAsDataURL(file);
}

async function whatCanIMake(imgBase64, mediaType){
  state.busy = true; state.busyMsg = 'Looking at what you have...'; render();
  const system = `You are Norvix, an AI nutrition coach. Return ONLY valid JSON, no markdown.`;
  const p = state.profile || {};
  let userContent;
  if(imgBase64){
    userContent = [
      {type:"image_url", image_url:{url:`data:${mediaType||"image/jpeg"};base64,${imgBase64}`}},
      {type:"text", text:`Identify the food items visible in this photo (fridge, kitchen counter, or garden). Then suggest 3 meals that can be made mostly from what's visible, matching diet preference: ${p.diet||'no preference'}, avoiding: ${p.restrict||'nothing specified'}. Return strictly: {"recipes":[{"name":"...","description":"...","ingredients_used":["..."]}]} with 3 items.`}
    ];
  } else {
    userContent = `Ingredients available: ${state.ingredients.join(', ')}. Diet preference: ${p.diet||'no preference'}. Avoid: ${p.restrict||'nothing specified'}. Suggest 3 meals using mostly these ingredients. Return strictly: {"recipes":[{"name":"...","description":"...","ingredients_used":["..."]}]} with 3 items.`;
  }
  try{
    const txt = await callClaude(system, userContent);
    const result = parseJSON(txt);
    state.recipeResults = result.recipes;
  }catch(e){ alert('Could not generate recipes right now.'); }
  state.busy = false; render();
}

async function generateReview(){
  state.busy = true; state.busyMsg = 'Writing your weekly review...'; render();
  const cl = state.checklist || {workouts:[false,false,false,false,false,false,false], meals:{}};
  const workoutsDone = cl.workouts.filter(Boolean).length;
  let totalMeals=0, doneMeals=0;
  state.weekplan.days.forEach((d,i)=>{
    const mt = Object.keys(d.meals||{});
    totalMeals += mt.length;
    const dm = cl.meals[i]||{};
    doneMeals += mt.filter(m=>dm[m]).length;
  });
  const adherence = totalMeals ? Math.round(doneMeals/totalMeals*100) : 0;
  const system = `You are Norvix, an encouraging but honest AI strength coach. Write a short (3-4 sentence) weekly review. No markdown, plain text only, no JSON.`;
  const prompt = `This person completed ${workoutsDone} of 7 planned workouts and hit ${adherence}% of planned meals this week. Their goal is: ${state.profile.goal}. Write a brief, specific, encouraging coach note and one concrete suggestion for next week.`;
  try{
    state.review = await callClaude(system, prompt);
  }catch(e){ state.review = null; alert('Could not generate the review right now.'); }
  state.busy = false; render();
}

boot();
</script>

</html>
